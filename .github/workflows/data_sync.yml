name: 'Minecraft Data Generator & API Sync'

on:
  schedule:
    - cron: '0 18 * * *'   # daily at 18:00 UTC
  workflow_dispatch:

# Never let two runs push at the same time
concurrency:
  group: minecraft-data-sync
  cancel-in-progress: false

jobs:
  generate_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    env:
      DATA_BRANCH: data          
      START_VERSION: "1.8.9"   
      INCLUDE_DATA: "false"   
      SITE_URL: ""            

    steps:
      - name: 1. Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: 2. Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so the push triggers the GitHub Pages build; falls back to the built-in token
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: 3. Switch to data branch (create orphan branch if missing)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "GitHub Actions Bot"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH"
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          else
            git checkout --orphan "$DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            git commit --allow-empty -m "Initialize data branch"
            git push origin "$DATA_BRANCH"
          fi

      - name: 4. Generate data for new versions
        run: |
          set -euo pipefail

          MANIFEST_URL="https://launchermeta.mojang.com/mc/game/version_manifest.json"
          VERSIONS_DIR="versions"
          WORK_DIR="$RUNNER_TEMP/mcgen"   # outside the repo, so JARs are never committed
          mkdir -p "$VERSIONS_DIR" "$WORK_DIR"

          echo "Loading version manifest..."
          MANIFEST=$(curl -sf "$MANIFEST_URL")

          START_INDEX=$(echo "$MANIFEST" | jq -r --arg v "$START_VERSION" '.versions | map(.id) | index($v)')
          if [ "$START_INDEX" == "null" ]; then
            echo "START_VERSION $START_VERSION not found in manifest. Aborting."
            exit 1
          fi

          # Oldest -> newest, from START_VERSION up to the latest
          echo "$MANIFEST" | jq -c --argjson i "$START_INDEX" \
            '.versions | .[0:$i+1] | reverse | .[]' > "$WORK_DIR/versions.jsonl"

          PROCESSED=0

          # fd 3 keeps java/git/curl from swallowing the loop's input
          while IFS= read -r OBJ <&3; do
            ID=$(echo "$OBJ"           | jq -r '.id')
            TYPE=$(echo "$OBJ"         | jq -r '.type')   # release / snapshot / ...
            URL=$(echo "$OBJ"          | jq -r '.url')
            RELEASE_TIME=$(echo "$OBJ" | jq -r '.releaseTime')

            CLEAN_ID=$(echo "$ID" | sed 's/[ \/]/-/g')
            TARGET="$VERSIONS_DIR/$TYPE/$CLEAN_ID"

            echo -e "\n--- $ID ($TYPE) ---"

            if [ -f "$TARGET/meta.json" ]; then
              echo "Already generated. Skipping."
              continue
            fi

            JAR_URL=$(curl -sf "$URL" | jq -r '.downloads.server.url // empty' || true)
            if [ -z "$JAR_URL" ]; then
              echo "No server JAR for $ID. Skipping."
              continue
            fi

            RUN_DIR="$WORK_DIR/$CLEAN_ID"
            mkdir -p "$RUN_DIR"
            curl -sfL "$JAR_URL" -o "$RUN_DIR/server.jar"

            echo "Running data generator..."
            ( cd "$RUN_DIR" && java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --all )

            if [ ! -d "$RUN_DIR/generated/reports" ]; then
              echo "Generator produced no reports for $ID. Skipping."
              rm -rf "$RUN_DIR"
              continue
            fi

            mkdir -p "$TARGET"
            cp -r "$RUN_DIR/generated/reports" "$TARGET/"
            if [ "$INCLUDE_DATA" = "true" ] && [ -d "$RUN_DIR/generated/data" ]; then
              cp -r "$RUN_DIR/generated/data" "$TARGET/"
            fi
            rm -rf "$RUN_DIR"

            jq -n --arg id "$ID" --arg type "$TYPE" --arg rt "$RELEASE_TIME" --arg path "$TARGET" \
              '{id:$id, type:$type, releaseTime:$rt, path:$path}' > "$TARGET/meta.json"

            git add "$TARGET"
            git commit -m "Add data for $ID ($TYPE)"
            git pull --rebase origin "$DATA_BRANCH"
            git push origin "HEAD:$DATA_BRANCH"
            PROCESSED=$((PROCESSED + 1))
          done 3< "$WORK_DIR/versions.jsonl"

          # ------------------------------------------------------------------
          # Site files: index, latest, OpenAPI spec, docs UI
          # ------------------------------------------------------------------
          echo "Building API index and docs..."

          if ls "$VERSIONS_DIR"/*/*/meta.json >/dev/null 2>&1; then
            jq -s 'sort_by(.releaseTime) | reverse' "$VERSIONS_DIR"/*/*/meta.json > versions.json
          else
            echo "[]" > versions.json
          fi

          echo "$MANIFEST" | jq '{release: .latest.release, snapshot: .latest.snapshot}' > latest.json
          LATEST_RELEASE=$(echo "$MANIFEST" | jq -r '.latest.release')

          if [ -n "${SITE_URL:-}" ]; then
            SITE="${SITE_URL%/}"
          else
            OWNER="${GITHUB_REPOSITORY_OWNER,,}"
            SITE="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi

          # Every top-level report file found in any version becomes an endpoint
          REPORTS_JSON=$(find "$VERSIONS_DIR" -mindepth 4 -maxdepth 4 -type f -path '*/reports/*.json' -printf '%f\n' \
            | sort -u | jq -R . | jq -s .)

          jq -n \
            --arg server "$SITE" \
            --arg example "$LATEST_RELEASE" \
            --argjson reports "$REPORTS_JSON" '
            def ok($d): {"200": {description: $d, content: {"application/json": {schema: {type: "object"}}}}, "404": {description: "Not found"}};
            {
              openapi: "3.0.3",
              info: {
                title: "Minecraft Data API",
                version: "1.0.0",
                description: "Static JSON generated daily with the official Minecraft data generator (--all). Updated automatically by GitHub Actions."
              },
              servers: [{url: $server}],
              tags: [{name: "Index"}, {name: "Reports"}],
              paths: (
                {
                  "/versions.json": {get: {tags: ["Index"], summary: "List all available versions (newest first)",
                    responses: {"200": {description: "Array of versions", content: {"application/json": {schema: {type: "array",
                      items: {type: "object", properties: {id: {type: "string"}, type: {type: "string"}, releaseTime: {type: "string"}, path: {type: "string"}}}}}}}}}},
                  "/latest.json": {get: {tags: ["Index"], summary: "Latest release and snapshot ids",
                    responses: {"200": {description: "Latest ids", content: {"application/json": {schema: {type: "object",
                      properties: {release: {type: "string"}, snapshot: {type: "string"}}}}}}}}}
                }
                + ($reports | map({
                    key: "/versions/{type}/{id}/reports/\(.)",
                    value: {get: {
                      tags: ["Reports"],
                      summary: "\(.)",
                      parameters: [{"$ref": "#/components/parameters/type"}, {"$ref": "#/components/parameters/id"}],
                      responses: ok("Generated report")
                    }}
                  }) | from_entries)
              ),
              components: {parameters: {
                type: {name: "type", "in": "path", required: true, schema: {type: "string", "enum": ["release", "snapshot"]}},
                id:   {name: "id",   "in": "path", required: true, schema: {type: "string", "default": $example}, description: "Version id, for example 1.21.10"}
              }}
            }' > openapi.json

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Minecraft Data API</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script>
              window.ui = SwaggerUIBundle({
                url: "openapi.json",
                dom_id: "#swagger-ui",
                deepLinking: true
              });
            </script>
          </body>
          </html>
          EOF

          # Skip Jekyll processing (faster builds, nothing gets ignored)
          touch .nojekyll

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update index, latest.json and OpenAPI docs"
            git pull --rebase origin "$DATA_BRANCH"
            git push origin "HEAD:$DATA_BRANCH"
          fi

          echo -e "\n*** Done. $PROCESSED new version(s) pushed to $DATA_BRANCH. ***"
